<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Food Menu</title>
		<link rel="stylesheet" href="../styles.css" />
	</head>
	<body>
		<!--<button id="fs-btn">⛶ Full Screen</button>-->
		<div class="menu-wrapper">
			<main class="menu-screen video-playlist">
				<!-- Plays img/food_menu_loop.mp4: the food board on repeat, with the THIRTEEN promo
				     (stinger transition) every few minutes. Set in food/playlist.json; see README.
				     Open with ?debug for a status box. -->
				<video class="menu-video" muted playsinline preload="auto"
					poster="../img/TV-menu-food.png" data-fallback="../img/food_menu_loop.mp4"></video>
			</main>
		</div>
	<div id="debug" hidden></div>
	<script src="../drink/player.js"></script>
	<script>
	(function () {
		const btn = document.getElementById("fs-btn");
		if (!btn) return; // button is commented out above
	
		btn.addEventListener("click", async () => {
			try {
				if (!document.fullscreenElement) {
					await document.documentElement.requestFullscreen();
				}
			} catch (e) {
				console.error(e);
			}
		});
	
		document.addEventListener("fullscreenchange", () => {
			const fs = !!document.fullscreenElement;
	
			if (fs) {
				// in fullscreen: hide button & force no scrollbars
				btn.classList.add("hidden");
				document.documentElement.style.overflow = "hidden";
			} else {
				// exited fullscreen: show button again
				btn.classList.remove("hidden");
				document.documentElement.style.overflow = "hidden";
			}
		});
	})();
	</script>
	</body>
</html>
