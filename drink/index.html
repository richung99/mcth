<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Drink Menu</title>
		<link rel="stylesheet" href="../styles.css">
	</head>
	<body>
		<!--<button id="fs-btn">⛶ Full Screen</button>-->
		<div class="menu-wrapper">
			<main class="menu-screen video-playlist">
				<!--
					drink_menu_loop.mp4 is the two menu videos joined into one file
					(card_flip_instagram, then pumpkin_specials). Playing ONE file with
					"loop" is the only way to avoid a black flash between clips on TV
					browsers, since they blank the screen whenever the video file changes.
				-->
				<video class="menu-video" src="../img/drink_menu_loop.mp4"
					muted loop autoplay playsinline preload="auto"
					poster="../img/TV-menu-drink.png"></video>
			</main>
		</div>
		<div id="debug" hidden></div>
		<script>
		(function () {
			const video = document.querySelector(".menu-video");
			const debugBox = document.getElementById("debug");
			const DEBUG = /[?&]debug\b/.test(location.search);
			const log = [];
			let lastTime = -1;
			let stalledFor = 0;
			let loops = 0;

			video.muted = true; // muted video is allowed to start on its own (no click needed)

			function note(msg) {
				if (!DEBUG) return;
				log.unshift(new Date().toLocaleTimeString() + "  " + msg);
				log.length = Math.min(log.length, 8);
			}

			function start() {
				const p = video.play();
				if (p && p.catch) p.catch((e) => note("play() refused: " + e.name));
			}

			video.addEventListener("seeked", () => {
				if (video.currentTime < 1) note("looped (" + ++loops + ")");
			});
			video.addEventListener("error", () => {
				note("video failed to load (code " + (video.error && video.error.code) + "), retrying");
				setTimeout(() => { video.load(); start(); }, 3000);
			});

			// Safety net: if the video stops moving (TV hiccup, network blip), nudge it;
			// if it stays frozen for ~15s, reload it.
			setInterval(() => {
				if (DEBUG) {
					debugBox.hidden = false;
					debugBox.textContent =
						"drink_menu_loop.mp4   time " + video.currentTime.toFixed(1) + " / " +
						(video.duration || 0).toFixed(1) + "   paused=" + video.paused +
						"   ready=" + video.readyState +
						(video.error ? "   ERROR code " + video.error.code : "") + "\n\n" + log.join("\n");
				}
				if (video.error) return;
				if (video.paused) start();
				if (video.currentTime === lastTime) {
					if (++stalledFor >= 15) {
						note("stuck at " + video.currentTime.toFixed(1) + "s, reloading");
						stalledFor = 0;
						video.load();
						start();
					}
				} else {
					stalledFor = 0;
				}
				lastTime = video.currentTime;
			}, 1000);

			start();
		})();

		// ---- Optional full-screen button (only runs if the button above is uncommented) ----
		const btn = document.getElementById("fs-btn");

		if (btn) {
			btn.addEventListener("click", async () => {
				try {
					if (!document.fullscreenElement) {
						await document.documentElement.requestFullscreen();
					}
				} catch (e) {
					console.error(e);
				}
			});

			document.addEventListener("fullscreenchange", () => {
				const fs = !!document.fullscreenElement;
				btn.classList.toggle("hidden", fs);
				document.documentElement.style.overflow = "hidden";
			});
		}
	</script>
	</body>
</html>
