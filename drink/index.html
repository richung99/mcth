<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Drink Menu</title>
		<link rel="stylesheet" href="../styles.css">
	</head>
	<body>
		<!--
			Drink menu TV page.
			- What plays is set in drink/playlist.json (menu videos + promo + how often).
			- GitHub joins those videos into img/drink_menu_loop.mp4 automatically
			  (scripts/build_drink_video.py), and player.js jumps around inside that
			  ONE file. TV browsers blank the screen whenever a video switches files,
			  so one file is what keeps it from ever blinking.
			- Open this page with ?debug to see an on-screen status box.
		-->
		<!--<button id="fs-btn">⛶ Full Screen</button>-->
		<div class="menu-wrapper">
			<main class="menu-screen video-playlist">
				<!-- No "loop" attribute on purpose: player.js decides what plays after each loop. -->
				<video class="menu-video" muted playsinline preload="auto"
					poster="../img/TV-menu-drink.png"></video>
			</main>
		</div>
		<div id="debug" hidden></div>
		<script src="player.js"></script>
		<script>
		// ---- Optional full-screen button (only runs if the button above is uncommented) ----
		const btn = document.getElementById("fs-btn");

		if (btn) {
			btn.addEventListener("click", async () => {
				try {
					if (!document.fullscreenElement) {
						await document.documentElement.requestFullscreen();
					}
				} catch (e) {
					console.error(e);
				}
			});

			document.addEventListener("fullscreenchange", () => {
				const fs = !!document.fullscreenElement;
				btn.classList.toggle("hidden", fs);
				document.documentElement.style.overflow = "hidden";
			});
		}
	</script>
	</body>
</html>
