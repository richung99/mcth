<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Drink Menu</title>
		<link rel="stylesheet" href="../styles.css">
	</head>
	<body>
		<!--<button id="fs-btn">⛶ Full Screen</button>-->
		<div class="menu-wrapper">
			<main class="menu-screen video-playlist">
				<!-- Holds the last frame of the previous video so there's no black flash while the next one loads -->
				<canvas class="menu-video-hold"></canvas>
				<!-- ONE video player that swaps files. (TV browsers often can't run two players at once.) -->
				<video class="menu-video" muted playsinline autoplay preload="auto" poster="../img/TV-menu-drink.png"></video>
			</main>
		</div>
		<div id="debug" hidden></div>
		<script>
		// ---- Drink menu video playlist ----
		// Add, remove or reorder videos here; they play in this order and loop forever.
		const DRINK_VIDEOS = [
			"../img/mcteahouse_menu_card_flip_instagram.mp4",
			"../img/mcteahouse_menu_pumpkin_specials.mp4",
		];

		(function () {
			const video = document.querySelector(".menu-video");
			const hold = document.querySelector(".menu-video-hold");
			const debugBox = document.getElementById("debug");
			const DEBUG = /[?&]debug\b/.test(location.search);
			const log = [];

			let current = -1;
			let lastTime = -1;
			let stalledFor = 0;

			function note(msg) {
				if (!DEBUG) return;
				log.unshift(new Date().toLocaleTimeString() + "  " + msg);
				log.length = Math.min(log.length, 8);
			}

			function renderDebug() {
				if (!DEBUG) return;
				debugBox.hidden = false;
				debugBox.textContent =
					"Video " + (current + 1) + " of " + DRINK_VIDEOS.length + ": " +
					DRINK_VIDEOS[current].split("/").pop() + "\n" +
					"time " + video.currentTime.toFixed(1) + " / " + (video.duration || 0).toFixed(1) +
					"   paused=" + video.paused + "   ready=" + video.readyState +
					(video.error ? "   ERROR code " + video.error.code : "") + "\n\n" +
					log.join("\n");
			}

			// Copy the frame on screen into the canvas behind the video, so the swap is seamless.
			function holdFrame() {
				try {
					if (!video.videoWidth) return;
					hold.width = video.videoWidth;
					hold.height = video.videoHeight;
					hold.getContext("2d").drawImage(video, 0, 0);
				} catch (e) {
					/* not critical */
				}
			}

			function playNext() {
				holdFrame();
				current = (current + 1) % DRINK_VIDEOS.length;
				lastTime = -1;
				stalledFor = 0;
				note("start video " + (current + 1));

				video.removeAttribute("poster");
				video.src = DRINK_VIDEOS[current];
				video.load();
				const p = video.play();
				if (p && p.catch) p.catch((e) => note("play() refused: " + e.name));
			}

			video.addEventListener("ended", () => {
				note("video " + (current + 1) + " ended");
				playNext();
			});

			video.addEventListener("error", () => {
				note("video " + (current + 1) + " failed to load (code " + (video.error && video.error.code) + ")");
				setTimeout(playNext, 1500);
			});

			// Safety net: if the video stops moving for ~10s (TV hiccup, network blip),
			// try to resume it, and if that doesn't work, go to the next video.
			setInterval(() => {
				renderDebug();
				if (video.error) return; // the "error" handler deals with it
				if (video.paused && !video.ended) {
					const p = video.play();
					if (p && p.catch) p.catch(() => {});
				}
				if (video.currentTime === lastTime) {
					stalledFor += 1;
					if (stalledFor >= 10) {
						note("video " + (current + 1) + " stuck at " + video.currentTime.toFixed(1) + "s, skipping");
						playNext();
					}
				} else {
					stalledFor = 0;
				}
				lastTime = video.currentTime;
			}, 1000);

			playNext();
		})();

		// ---- Optional full-screen button (only runs if the button above is uncommented) ----
		const btn = document.getElementById("fs-btn");

		if (btn) {
			btn.addEventListener("click", async () => {
				try {
					if (!document.fullscreenElement) {
						await document.documentElement.requestFullscreen();
					}
				} catch (e) {
					console.error(e);
				}
			});

			document.addEventListener("fullscreenchange", () => {
				const fs = !!document.fullscreenElement;
				btn.classList.toggle("hidden", fs);
				document.documentElement.style.overflow = "hidden";
			});
		}
	</script>
	</body>
</html>
